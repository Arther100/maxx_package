function totalVegMenusSelected(vegMenus) {
  return Object.values(vegMenus || {}).flat().length;
}

function formatVegMenusText(vegMenus) {
  return MENU_CATEGORIES.map(cat => {
    const sel = (vegMenus || {})[cat.id] || [];
    if (!sel.length) return null;
    return `${cat.icon} ${cat.label}: ${sel.join(", ")}`;
  }).filter(Boolean).join(" | ");
}

function hasVegCatering(form, vegMenuCount) {
  return !!(form.vegCount && vegMenuCount > 0);
}

function hasNonVegCatering(form) {
  return !!form.nonVegCount;
}

function formatFoodWhatsAppBlock(form, vegMenuCount) {
  const lines = [];
  if (hasVegCatering(form, vegMenuCount)) {
    lines.push(`🥦 Veg Guests   : ${form.vegCount}`);
    MENU_CATEGORIES.forEach(cat => {
      const sel = (form.vegMenus || {})[cat.id] || [];
      if (sel.length) lines.push(`   ${cat.icon} ${cat.label}: ${sel.join(", ")}`);
    });
  }
  if (hasNonVegCatering(form)) {
    lines.push(`🍖 Non-Veg      : ${form.nonVegCount}`);
    lines.push(`   (Non-veg menu — MAXX team will confirm options)`);
  }
  if (!lines.length) lines.push("  Not specified");
  return lines.join("\n");
}

const getServicesForEvent = (eventId) => {
  const filtered = {};
  Object.entries(ALL_SERVICES).forEach(([cat, items]) => {
    const visible = items.filter(i => i.tags.includes(eventId));
    if (visible.length > 0) filtered[cat] = visible.map(i => i.item);
  });
  return filtered;
};

    setForm(f => {
      const newRanges = id === "haldi" ? HALDI_BUDGET_RANGES : BUDGET_RANGES;
      const budgetStillValid = newRanges.includes(f.budget);
      return {
        ...f,
        eventType: id,
        selected: {},
        budget: budgetStillValid ? f.budget : "",
        customBudget: budgetStillValid ? f.customBudget : "",
      };
    });
  };

  const toggleService = (cat, item) => {
    setForm(f => {
      const cur = f.selected[cat] || [];
      return {
        ...f,
        selected: {
          ...f.selected,
          [cat]: cur.includes(item) ? cur.filter(i => i !== item) : [...cur, item],
        },
      };
    });
  };

  const toggleVegMenu = (categoryId, menuName) => {
    setForm(f => {
      const cur = f.vegMenus[categoryId] || [];
      const next = cur.includes(menuName) ? cur.filter(m => m !== menuName) : [...cur, menuName];
      return { ...f, vegMenus: { ...f.vegMenus, [categoryId]: next } };
    });
  };

  const vegMenuCount = totalVegMenusSelected(form.vegMenus);
  const hasVeg = hasVegCatering(form, vegMenuCount);
  const hasNonVeg = hasNonVegCatering(form);
  const partialVeg = !!(form.vegCount || vegMenuCount > 0) && !hasVeg;

  const isSelected = (cat, item) => (form.selected[cat] || []).includes(item);
  const totalSelected = Object.values(form.selected).flat().length;
  const filteredServices = form.eventType ? getServicesForEvent(form.eventType) : {};
  const budgetRanges = form.eventType === "haldi" ? HALDI_BUDGET_RANGES : BUDGET_RANGES;
  const budgetDisplay = form.budget === "₹15,00,000+" && form.customBudget
    ? `₹${form.customBudget}`
    : form.budget;

  const friendlyError = (e) => {
    const m = String((e && e.message) || e || "");
    if (m.includes("invalid_phone")) return "Please enter a valid WhatsApp number, for example 98765 43210.";
    if (m.includes("invalid_name")) return "Please enter your full name.";
    if (m.includes("rate_limited")) return "Too many requests from this number. Please try again later or call us on +91 87786 67396.";
    return "We could not save your request right now. Please check your internet and try again.";
  };

  // skipDb = true only for the "send on WhatsApp anyway" fallback when saving failed.
  const buildWhatsApp = async (skipDb) => {
    if (saving) return;
    setSaving(true);
    setSaveError("");

    // Open a blank tab NOW (inside the tap) so phone/browser popup blockers allow it.
    // It is pointed at WhatsApp once the request is saved.
    let popup = null;
    try { popup = window.open("", "_blank"); } catch (e) { popup = null; }

    const selectedEvent = EVENT_TYPES.find(e => e.id === form.eventType);
    const selectedVenue = VENUE_TYPES.find(v => v.id === form.venueType);
    const bookerData = {
      name: form.name.trim(),
      phone: form.phone.trim(),
      personName: form.personName || "",
      eventType: selectedEvent?.label || form.eventType,
      date: form.date,
      location: form.location,
      venueType: selectedVenue?.label || form.venueType,
      venueNote: form.venueNote || "",
      budget: budgetDisplay,
      servicesCount: totalSelected,
      nonVegCount: form.nonVegCount || "",
      vegCount: form.vegCount || "",
      notes: [form.notes, formatVegMenusText(form.vegMenus)].filter(Boolean).join(" | ") || "",
      vegMenus: form.vegMenus,
      services: form.selected,
      status: "New",
      source: "form",
    };

    // 1) Save to the database FIRST. The server creates the unique quote reference.
    let code = "";
    if (skipDb) {
      code = "MXW-" + Math.random().toString(36).slice(2, 8).toUpperCase();
    } else {
      try {
        const saved = await window.MaxxLeads.createPublicLead(bookerData);
        code = saved && saved.quote_code;
        if (!code) throw new Error("No reference returned");
      } catch (e) {
        console.error("Failed to save lead to Supabase:", e);
        if (popup) { try { popup.close(); } catch (_) {} }
        setSaveError(friendlyError(e));
        setSaving(false);
        return;
      }
    }

    const personLabel =
      form.eventType === "puberty" ? "Girl's Name" :
      form.eventType === "wedding" ? "Bride / Groom Name" :
      form.eventType === "birthday" ? "Birthday Person" : "Person's Name";

    const servicesBlock = Object.entries(form.selected)
      .filter(([, items]) => items.length > 0)
      .map(([cat, items]) => `  ${cat}\n${items.map(i => `    ➤ ${i}`).join("\n")}`)
      .join("\n\n");

    const msg = [
      `╔══════════════════════════╗`,
      `      🌟 MAXX EVENTS 🌟`,
      `      New Quote Request`,
      `╚══════════════════════════╝`,
      ``,
      `🔖 *Quote Code  : ${code}*`,
      ``,
      `📋 *CLIENT DETAILS*`,
      `┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄`,
      `👤 Name         : ${form.name}`,
      `📱 WhatsApp     : ${form.phone}`,
      `🎂 ${personLabel.padEnd(14)}: ${form.personName || "—"}`,
      ``,
      `📅 *EVENT INFO*`,
      `┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄`,
      `🎊 Event Type   : ${selectedEvent?.label || form.eventType}`,
      `📅 Event Date   : ${form.date}`,
      `📍 Location     : ${form.location}`,
      `🏛️ Venue Type   : ${selectedVenue?.label || form.venueType}`,
      form.venueNote ? `🏠 Venue Name   : ${form.venueNote}` : null,
      `💰 Budget       : ${budgetDisplay}`,
      ``,
      `✅ *SELECTED SERVICES* (${totalSelected} items)`,
      `┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄`,
      servicesBlock || "  No services selected",
      ``,
      `🍽️ *CATERING & MENUS*`,
      `┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄`,
      formatFoodWhatsAppBlock(form, vegMenuCount),
      form.notes ? `\n📝 *SPECIAL NOTES*\n┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄\n${form.notes}` : null,
      ``,
      `━━━━━━━━━━━━━━━━━━━━━━━━`,
      `_Sent via MAXX Events Booking Form_`,
    ].filter(v => v !== null).join("\n");

    // 2) Backup copy to the Google Sheet (write-only, fire and forget).
    if (SHEETS_URL && !skipDb) {
      fetch(SHEETS_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
          quoteCode: code,
          name: bookerData.name,
          phone: bookerData.phone,
          personName: bookerData.personName,
          eventType: bookerData.eventType,
          date: bookerData.date,
          location: bookerData.location,
          venueType: bookerData.venueType,
          venueName: bookerData.venueNote,
          budget: bookerData.budget,
          servicesCount: totalSelected,
          nonVegCount: bookerData.nonVegCount,
          vegCount: bookerData.vegCount,
          notes: bookerData.notes,
          status: "New",
          source: "form",
          services: form.selected,
        })
      }).catch(() => {});
    }

    // 3) Open WhatsApp (to MAXX). The success screen also shows a button in case a popup was blocked.
    const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
    setWaUrl(url);
    setForm(f => ({ ...f, quoteCode: code }));
    if (popup) { try { popup.location.href = url; } catch (_) { window.open(url, "_blank"); } }
    setSubmitted(true);
    setSaving(false);
  };

  const canNext = () => {
    if (step === 0) return !!form.eventType;
    if (step === 1) return form.name.trim().length >= 2 && window.MaxxLeads.isValidPhone(form.phone) && form.date && form.location && form.budget &&
      (form.budget !== "₹15,00,000+" || form.customBudget.trim());
    if (step === 2) return !!form.venueType;
    if (step === 3) return totalSelected > 0;
    if (step === 4) {
      if (!hasVeg && !hasNonVeg) return false;
      if (partialVeg) return false;
      return true;
    }
    return true;
  };

  const progress = (step / (steps.length - 1)) * 100;

  if (submitted) {
    return (
      <div style={{ minHeight:"100vh", background:"#f0f3fa", display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
        <div style={{ background:"#fff", borderRadius:16, padding:36, textAlign:"center", maxWidth:380, width:"100%", boxShadow:"0 8px 40px rgba(13,27,75,0.12)" }}>
          <div style={{ fontSize:52, marginBottom:10 }}>🎉</div>
          <div style={{ fontFamily:"Georgia,serif", fontSize:22, fontWeight:700, color:NAVY, marginBottom:8 }}>Request Saved!</div>
          <p style={{ color:"#556", fontSize:13, lineHeight:1.8, marginBottom:16 }}>
            Your request is saved with MAXX Events. If WhatsApp did not open, tap the button below and press <strong>Send</strong>. We'll reply with your personalised package price soon!
          </p>
          {waUrl && (
            <a href={waUrl} target="_blank" rel="noopener noreferrer"
              style={{ display:"block", background:"#25D366", color:"#fff", textDecoration:"none", borderRadius:10, padding:"12px 16px", fontWeight:800, fontSize:14, marginBottom:16 }}>
              Open WhatsApp
            </a>
          )}
          <div style={{ background:"#fffbf0", border:`1.5px solid ${GOLD}`, borderRadius:10, padding:"12px 16px", marginBottom:16 }}>
            <div style={{ fontSize:10, color:GOLD, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.12em", marginBottom:4 }}>Your Quote Reference</div>
            <div style={{ fontSize:20, fontWeight:800, color:NAVY, letterSpacing:"0.08em" }}>{form.quoteCode}</div>
            <div style={{ fontSize:10, color:"#889", marginTop:3 }}>Share this code when contacting us</div>
          </div>
          <div style={{ background:"#f0f3fa", borderRadius:10, padding:"12px 16px", marginBottom:20 }}>
            <div style={{ fontSize:10, color:GOLD, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.12em", marginBottom:3 }}>Direct Contact</div>
            <div style={{ fontSize:15, fontWeight:700, color:NAVY }}>📱 +91 87786 67396</div>
          </div>
          <button onClick={() => { setSubmitted(false); setSaveError(""); setWaUrl(""); setStep(0); setMenuTab("breakfast"); setCateringTab("veg"); setForm({ name:"",phone:"",personName:"",date:"",location:"",budget:"",venueType:"",venueNote:"",eventType:"",selected:{},vegMenus:emptyVegMenus(),nonVegCount:"",vegCount:"",notes:"",customBudget:"",quoteCode:"" }); }}
            style={{ background:NAVY, color:"#fff", border:"none", borderRadius:8, padding:"11px 28px", fontSize:14, fontWeight:600, cursor:"pointer" }}>
            New Enquiry
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight:"100vh", background:"#f0f3fa", fontFamily:"'Inter',Arial,sans-serif" }}>

      {/* PROGRESS */}
      <div style={{ background:NAVY2, padding:"10px 16px 0" }}>
        <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
          {steps.map((s, i) => (
            <div key={s} style={{ display:"flex", flexDirection:"column", alignItems:"center", flex:1 }}>
              <div style={{
                width:24, height:24, borderRadius:"50%",
                background: i < step ? GOLD : i === step ? "#fff" : "rgba(255,255,255,0.1)",
                color: i < step ? NAVY : i === step ? NAVY : "#556",
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:10, fontWeight:800, marginBottom:3,
                border: i === step ? `2px solid ${GOLD}` : "2px solid transparent",
              }}>
                {i < step ? "✓" : i + 1}
              </div>
              <div style={{ fontSize:8, color: i <= step ? GOLD : "#445", fontWeight: i === step ? 700 : 400, textAlign:"center" }}>{s}</div>
            </div>
          ))}
        </div>
        <div style={{ height:3, background:"rgba(255,255,255,0.08)", borderRadius:2 }}>
          <div style={{ height:"100%", background:GOLD, borderRadius:2, width:`${progress}%`, transition:"width 0.4s" }} />
        </div>
      </div>

      <div style={{ padding:18, maxWidth:520, margin:"0 auto" }}>

        {/* STEP 0 — EVENT TYPE */}
        {step === 0 && (
          <div>
            <StepTitle icon="🎊" title="Event Type" sub="Select your event first — we'll tailor everything for you" />
            <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
              {EVENT_TYPES.map(e => (
                <button key={e.id} onClick={() => setEventType(e.id)}
                  style={{ background:form.eventType===e.id ? NAVY:"#fff", color:form.eventType===e.id ? "#fff":NAVY, border:`2px solid ${form.eventType===e.id ? GOLD:"#dde2f0"}`, borderRadius:10, padding:"12px 16px", fontSize:13, fontWeight:600, cursor:"pointer", textAlign:"left", display:"flex", alignItems:"center", justifyContent:"space-between", transition:"all 0.2s" }}>
                  <div>
                    <div>{e.label}</div>
                    <div style={{ fontSize:10, color:form.eventType===e.id ? "#aabbdd":"#889", marginTop:2, fontWeight:400 }}>{e.sub}</div>
                  </div>
                  {form.eventType===e.id && <span style={{ color:GOLD, fontSize:18 }}>✓</span>}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* STEP 1 — DETAILS (budget dynamic based on event type) */}
        {step === 1 && (
          <div>
            <StepTitle icon="📋" title="Your Details" sub="Fill in your basic info to get started" />
            <Field label="Your Name *" value={form.name} onChange={v => set("name",v)} placeholder="Full name" />
            <Field label="WhatsApp Number *" value={form.phone} onChange={v => set("phone",v)} placeholder="+91 98765 43210" type="tel" inputMode="tel" autoComplete="tel" error={form.phone.trim() && !window.MaxxLeads.isValidPhone(form.phone) ? "Enter a valid 10-digit mobile number (or with country code)." : ""} />
            <Field label="Bride / Groom / Girl's Name" value={form.personName} onChange={v => set("personName",v)} placeholder="Name of the person being celebrated" />
            <Field label="Event Date *" value={form.date} onChange={v => set("date",v)} type="date" />
            <Field label="Event City / Location *" value={form.location} onChange={v => set("location",v)} placeholder="e.g. Chengalpet, Chennai" />
            <div style={{ marginBottom:6 }}>
              <label style={labelStyle}>Budget Range *</label>
              {form.eventType === "haldi" && (
                <div style={{ background:"#fff8e6", border:`1px solid ${GOLD}`, borderRadius:8, padding:"8px 12px", marginBottom:10, fontSize:11, color:"#7a5c00" }}>
                  🌿 Haldi packages start from <strong>₹50,000</strong> — up to ₹15L shown below
                </div>
              )}
              <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                {budgetRanges.map(b => (
                  <RadioPill key={b} label={b} selected={form.budget===b} onClick={() => { set("budget",b); if (b !== "₹15,00,000+") set("customBudget",""); }} />
                ))}
              </div>
              {form.budget === "₹15,00,000+" && (
                <div style={{ marginTop:10 }}>
                  <label style={labelStyle}>Enter Your Budget Amount *</label>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:14, fontWeight:700, color:NAVY }}>₹</span>
                    <input
                      type="text"
                      value={form.customBudget}
                      onChange={e => set("customBudget", e.target.value)}
                      placeholder="e.g. 18,00,000"
                      style={{ flex:1, border:"1.5px solid #C9A84C", borderRadius:8, padding:"10px 12px", fontSize:13, color:NAVY, outline:"none", fontFamily:"inherit", background:"#fffdf5" }}
                    />
                  </div>
                  <div style={{ fontSize:10, color:"#889", marginTop:4 }}>We'll plan a custom package matching your vision</div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* STEP 2 — VENUE */}
        {step === 2 && (
          <div>
            <StepTitle icon="🏛️" title="Venue Type" sub="Where will the event be held?" />
            <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
              {VENUE_TYPES.map(v => (
                <button key={v.id} onClick={() => set("venueType",v.id)}
                  style={{ background:form.venueType===v.id ? NAVY:"#fff", color:form.venueType===v.id ? "#fff":NAVY, border:`2px solid ${form.venueType===v.id ? GOLD:"#dde2f0"}`, borderRadius:10, padding:"12px 16px", fontSize:13, fontWeight:600, cursor:"pointer", textAlign:"left", display:"flex", alignItems:"center", justifyContent:"space-between", transition:"all 0.2s" }}>
                  <div>
                    <div>{v.label}</div>
                    <div style={{ fontSize:10, color:form.venueType===v.id ? "#aabbdd":"#889", marginTop:2, fontWeight:400 }}>{v.sub}</div>
                  </div>
                  {form.venueType===v.id && <span style={{ color:GOLD, fontSize:18 }}>✓</span>}
                </button>
              ))}
            </div>
            <div style={{ marginTop:14 }}>
              <label style={labelStyle}>Venue Name (optional)</label>
              <input value={form.venueNote} onChange={e => set("venueNote",e.target.value)}
                placeholder="e.g. Sri Murugan Kalyana Mandapam"
                style={{ width:"100%", border:"1.5px solid #dde2f0", borderRadius:8, padding:"10px 12px", fontSize:13, color:NAVY, outline:"none", fontFamily:"inherit", boxSizing:"border-box", background:"#fff" }} />
            </div>
          </div>
        )}

        {/* STEP 3 — SERVICES */}
        {step === 3 && (
          <div>
            <StepTitle icon="✅" title="Select Services" sub="Only services for your event are shown — tap to select" />
            <div style={{ background:NAVY, borderRadius:8, padding:"7px 14px", marginBottom:14, display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:12, color:GOLD, fontWeight:700 }}>
                {EVENT_TYPES.find(e => e.id===form.eventType)?.label}
              </span>
              <span style={{ fontSize:10, color:"#667" }}>— showing relevant services only</span>
            </div>
            {totalSelected > 0 && (
              <div style={{ background:"#e8f4e8", border:"1px solid #b8ddb8", borderRadius:8, padding:"8px 14px", marginBottom:14, fontSize:12, color:"#2e7d32", fontWeight:600 }}>
                ✅ {totalSelected} service{totalSelected>1?"s":""} selected
              </div>
            )}
            {Object.entries(filteredServices).map(([cat, items]) => (
              <div key={cat} style={{ marginBottom:18 }}>
                <div style={{ fontSize:13, fontWeight:800, color:NAVY, paddingBottom:5, borderBottom:`2px solid ${GOLD}`, display:"inline-block", marginBottom:8 }}>
                  {cat}
                </div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:7, marginTop:4 }}>
                  {items.map(item => {
                    const sel = isSelected(cat, item);
                    return (
                      <button key={item} onClick={() => toggleService(cat, item)}
                        style={{ background:sel ? NAVY:"#fff", color:sel ? "#fff":"#334", border:`1.5px solid ${sel ? GOLD:"#dde2f0"}`, borderRadius:20, padding:"6px 12px", fontSize:11, fontWeight:sel ? 600:400, cursor:"pointer", transition:"all 0.15s", display:"flex", alignItems:"center", gap:5 }}>
                        {sel && <span style={{ color:GOLD, fontSize:9 }}>✓</span>}
                        {item}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* STEP 4 — CATERING & MENU */}
        {step === 4 && (
          <div>
            <StepTitle icon="🍽️" title="Catering & Menu" sub="Switch between Veg and Non-Veg tabs — both selections are kept." />

            <div style={{ background:"#fff8e6", border:`1px solid ${GOLD}`, borderRadius:8, padding:"8px 12px", marginBottom:14, fontSize:11, color:"#7a5c00", lineHeight:1.6 }}>
              Minimum order <strong>300 plates</strong> · Fully customizable · You can pick both veg and non-veg
            </div>

            <label style={labelStyle}>Catering Type *</label>
            <div style={{ display:"flex", gap:6, marginBottom:14 }}>
              <button type="button" onClick={() => setCateringTab("veg")}
                style={{ flex:1, background:cateringTab==="veg" ? NAVY:"#fff", color:cateringTab==="veg" ? "#fff":NAVY, border:`2px solid ${cateringTab==="veg" ? GOLD : hasVeg ? GOLD : "#dde2f0"}`, borderRadius:10, padding:"12px 10px", fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
                🥦 Veg {hasVeg && <span style={{ color:cateringTab==="veg" ? GOLD : "#2e7d32", marginLeft:4 }}>✓</span>}
              </button>
              <button type="button" onClick={() => setCateringTab("nonveg")}
                style={{ flex:1, background:cateringTab==="nonveg" ? NAVY:"#fff", color:cateringTab==="nonveg" ? "#fff":NAVY, border:`2px solid ${cateringTab==="nonveg" ? GOLD : hasNonVeg ? GOLD : "#dde2f0"}`, borderRadius:10, padding:"12px 10px", fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
                🍖 Non-Veg {hasNonVeg && <span style={{ color:cateringTab==="nonveg" ? GOLD : "#2e7d32", marginLeft:4 }}>✓</span>}
              </button>
            </div>

            {cateringTab === "veg" && hasNonVeg && (
              <div style={{ background:"#f0f3fa", border:"1px solid #dde2f0", borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:11, color:"#556" }}>
                🍖 Non-veg saved: <strong>{form.nonVegCount}</strong> guests — switch to Non-Veg tab to edit
              </div>
            )}

            {cateringTab === "nonveg" && hasVeg && (
              <div style={{ background:"#e8f4e8", border:"1px solid #b8ddb8", borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:11, color:"#2e7d32" }}>
                🥦 Veg saved: <strong>{form.vegCount}</strong> guests · {vegMenuCount} menu combo{vegMenuCount > 1 ? "s" : ""} — switch to Veg tab to edit
              </div>
            )}

            {cateringTab === "veg" && (
              <div style={{ marginBottom:20 }}>
                <label style={labelStyle}>🥦 Veg Guest Count *</label>
                <div style={{ display:"flex", flexWrap:"wrap", gap:7, marginBottom:14 }}>
                  {FOOD_COUNTS.map(c => <RadioPill key={c} label={c} selected={form.vegCount===c} onClick={() => set("vegCount",c)} small />)}
                </div>

                <label style={labelStyle}>Select Veg Menu Combos *</label>
                <div style={{ display:"flex", gap:6, marginBottom:12, flexWrap:"wrap" }}>
                  {MENU_CATEGORIES.map(cat => (
                    <button key={cat.id} type="button" onClick={() => setMenuTab(cat.id)}
                      style={{ background:menuTab===cat.id ? NAVY:"#fff", color:menuTab===cat.id ? "#fff":NAVY, border:`1.5px solid ${menuTab===cat.id ? GOLD:"#dde2f0"}`, borderRadius:20, padding:"7px 14px", fontSize:11, fontWeight:menuTab===cat.id ? 700:500, cursor:"pointer", fontFamily:"inherit" }}>
                      {cat.icon} {cat.label}
                      {(form.vegMenus[cat.id] || []).length > 0 && (
                        <span style={{ marginLeft:5, color:menuTab===cat.id ? GOLD : NAVY }}>({(form.vegMenus[cat.id] || []).length})</span>
                      )}
                    </button>
                  ))}
                </div>

                {vegMenuCount > 0 && (
                  <div style={{ background:"#e8f4e8", border:"1px solid #b8ddb8", borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:11, color:"#2e7d32", fontWeight:600 }}>
                    ✅ {vegMenuCount} veg menu combo{vegMenuCount > 1 ? "s" : ""} selected
                  </div>
                )}

                <div style={{ display:"flex", flexDirection:"column", gap:8, maxHeight:340, overflowY:"auto", paddingRight:4 }}>
                  {((window.VEG_MENUS || VEG_MENUS)[menuTab] || []).length === 0 ? (
                    <div style={{ background:"#fff8e6", border:`1px solid ${GOLD}`, borderRadius:8, padding:"12px 14px", fontSize:12, color:"#7a5c00", lineHeight:1.6 }}>
                      Menu list could not load. Please refresh the page — if this persists, contact MAXX on WhatsApp.
                    </div>
                  ) : (
                    ((window.VEG_MENUS || VEG_MENUS)[menuTab] || []).map(menu => (
                      <MenuCard key={menu.name} menu={menu}
                        selected={(form.vegMenus[menuTab] || []).includes(menu.name)}
                        onToggle={() => toggleVegMenu(menuTab, menu.name)} />
                    ))
                  )}
                </div>
              </div>
            )}

            {cateringTab === "nonveg" && (
              <div style={{ marginBottom:20 }}>
                <label style={labelStyle}>🍖 Non-Veg Guest Count *</label>
                <div style={{ display:"flex", flexWrap:"wrap", gap:7, marginBottom:10 }}>
                  {FOOD_COUNTS.map(c => <RadioPill key={"nv"+c} label={c} selected={form.nonVegCount===c} onClick={() => set("nonVegCount",c)} small />)}
                </div>
                <div style={{ background:"#f0f3fa", border:"1px solid #dde2f0", borderRadius:8, padding:"10px 12px", fontSize:11, color:"#556", lineHeight:1.6 }}>
                  Non-veg menu combos will be shared by the MAXX team on WhatsApp after your enquiry.
                </div>
              </div>
            )}

            {partialVeg && (
              <div style={{ background:"#fff3e0", border:"1px solid #ffcc80", borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:11, color:"#e65100" }}>
                Complete veg guest count and at least one menu combo, or clear veg selections to continue with non-veg only
              </div>
            )}

            {!hasVeg && !hasNonVeg && (
              <div style={{ fontSize:12, color:"#889", textAlign:"center", padding:"8px 0 12px" }}>
                Fill in at least one tab — veg, non-veg, or both
              </div>
            )}

            <div style={{ marginBottom:6, marginTop:8 }}>
              <label style={labelStyle}>Special Requirements / Notes</label>
              <textarea value={form.notes} onChange={e => set("notes",e.target.value)}
                placeholder="e.g. Jain food, no onion garlic, specific meal timing..."
                style={{ width:"100%", border:"1.5px solid #dde2f0", borderRadius:8, padding:"10px 12px", fontSize:13, color:NAVY, minHeight:70, resize:"vertical", outline:"none", fontFamily:"inherit", boxSizing:"border-box" }} />
            </div>
          </div>
        )}

        {/* STEP 5 — REVIEW */}
        {step === 5 && (
          <div>
            <StepTitle icon="📤" title="Review & Send" sub="Check everything and send your quote request" />
            <ReviewCard label="👤 Client Details">
              <ReviewRow k="Name" v={form.name} />
              <ReviewRow k="WhatsApp" v={form.phone} />
              {form.personName && <ReviewRow k="Person's Name" v={form.personName} />}
              <ReviewRow k="Event Date" v={form.date} />
              <ReviewRow k="Location" v={form.location} />
              <ReviewRow k="Budget" v={budgetDisplay} />
            </ReviewCard>
            <ReviewCard label="🏛️ Venue & Event">
              <ReviewRow k="Event Type" v={EVENT_TYPES.find(e => e.id===form.eventType)?.label || "—"} />
              <ReviewRow k="Venue Type" v={VENUE_TYPES.find(v => v.id===form.venueType)?.label || "—"} />
              {form.venueNote && <ReviewRow k="Venue Name" v={form.venueNote} />}
            </ReviewCard>
            <ReviewCard label={`✅ Services Selected (${totalSelected})`}>
              {Object.entries(form.selected).filter(([,items]) => items.length>0).map(([cat, items]) => (
                <div key={cat} style={{ marginBottom:9 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:NAVY, marginBottom:3 }}>{cat}</div>
                  {items.map(i => <div key={i} style={{ fontSize:11, color:"#445", paddingLeft:10, lineHeight:1.75 }}>• {i}</div>)}
                </div>
              ))}
            </ReviewCard>
            <ReviewCard label="🍽️ Catering & Menus">
              {!hasVeg && !hasNonVeg && <ReviewRow k="Selection" v="—" />}
              {hasVeg && (
                <>
                  <ReviewRow k="Veg Guests" v={form.vegCount || "—"} />
                  {MENU_CATEGORIES.map(cat => {
                    const sel = (form.vegMenus || {})[cat.id] || [];
                    if (!sel.length) return null;
                    return <ReviewRow key={cat.id} k={`${cat.icon} ${cat.label}`} v={sel.join(", ")} />;
                  })}
                </>
              )}
              {hasNonVeg && (
                <>
                  <ReviewRow k="Non-Veg Guests" v={form.nonVegCount || "—"} />
                  <ReviewRow k="Non-Veg Menu" v="To be confirmed by MAXX" />
                </>
              )}
              {form.notes && <ReviewRow k="Notes" v={form.notes} />}
            </ReviewCard>
            <div style={{ background:"#e8f5e8", border:"1px solid #b8ddb8", borderRadius:10, padding:"12px 16px", marginBottom:16, fontSize:12, color:"#2e7d32", lineHeight:1.75 }}>
              📱 Tapping <strong>Get My Quote</strong> opens WhatsApp and sends your details directly to MAXX Events on <strong>+91 87786 67396</strong>
            </div>
            {saveError && (
              <div role="alert" style={{ background:"#fdecea", border:"1px solid #f5c6c2", borderRadius:10, padding:"12px 16px", marginBottom:12, fontSize:12.5, color:"#b3261e", lineHeight:1.7 }}>
                {saveError}
                <div style={{ marginTop:8 }}>
                  <button onClick={() => buildWhatsApp(true)} disabled={saving}
                    style={{ background:"transparent", border:"1px solid #b3261e", color:"#b3261e", borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:700, cursor:"pointer" }}>
                    Send on WhatsApp anyway
                  </button>
                </div>
              </div>
            )}
            <button onClick={() => buildWhatsApp(false)} disabled={saving}
              style={{ width:"100%", background:"#25D366", border:"none", borderRadius:12, padding:"16px 20px", fontSize:15, fontWeight:800, color:"#fff", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:10, boxShadow:"0 4px 16px rgba(37,211,102,0.35)", opacity: saving ? 0.7 : 1 }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              {saving ? "Saving your request…" : "Get My Quote on WhatsApp"}
            </button>
          </div>
        )}

        {/* NAV */}
        <div style={{ display:"flex", gap:10, marginTop:18 }}>
          {step > 0 && (
            <button onClick={() => setStep(s => s-1)}
              style={{ flex:1, background:"#fff", border:`1.5px solid ${NAVY}`, color:NAVY, borderRadius:10, padding:"12px", fontSize:13, fontWeight:600, cursor:"pointer" }}>
              ← Back
            </button>
          )}
          {step < steps.length-1 && (
            <button aria-disabled={!canNext()} onClick={() => { if (canNext()) setStep(s => s+1); }}
              style={{ flex:2, background:canNext() ? NAVY:"#c8cfe0", color:canNext() ? "#fff":"#99a", border:"none", borderRadius:10, padding:"12px", fontSize:14, fontWeight:700, cursor:canNext() ? "pointer":"not-allowed", transition:"all 0.2s" }}>
              Continue →
            </button>
          )}
        </div>

        <div style={{ textAlign:"center", marginTop:22, paddingBottom:24 }}>
          <div style={{ fontSize:9.5, color:"#99aacc", letterSpacing:"0.12em", textTransform:"uppercase" }}>
            MAXX Events &nbsp;·&nbsp; +91 87786 67396
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
function toggleMenu() {
  document.getElementById('mobileMenu').classList.toggle('open');
}
</script>

</body>
</html>
