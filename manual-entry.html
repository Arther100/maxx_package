<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Entry — MAXX Events & Planners</title>
<meta name="description" content="Add old enquiries manually to MAXX Events">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0A0A0A;
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --white: #F8F4EE;
  --charcoal: #1A1A1A;
  --mid: #2A2A2A;
  --muted: #666;
  --green: #25D366;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--white);font-family:'Outfit',sans-serif;min-height:100vh}

.logo-header{background:var(--charcoal);border-bottom:1px solid rgba(201,168,76,.2);padding:12px 20px;display:flex;align-items:center;justify-content:center}
.logo-header a{text-decoration:none;display:flex;align-items:center;gap:10px}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.06em;color:var(--white)}
.logo-text span{color:var(--gold)}
.logo-sub{font-size:9px;color:rgba(201,168,76,.7);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}

.page-header{padding:60px 5vw 24px;text-align:center}
.page-eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;font-weight:500;margin-bottom:12px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,5vw,52px);letter-spacing:.04em;margin-bottom:8px}
.page-title span{color:var(--gold)}
.page-sub{font-size:13px;color:var(--muted);max-width:520px;margin:0 auto}

.wrap{max-width:720px;margin:0 auto;padding:0 5vw 60px}

.panel{background:var(--charcoal);border:1px solid var(--mid);border-radius:14px;padding:24px;margin-bottom:20px}
.panel-title{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}

textarea#pasteBox{width:100%;min-height:320px;background:var(--black);border:1px solid var(--mid);border-radius:10px;padding:14px;color:var(--white);font-family:'Outfit',sans-serif;font-size:13px;line-height:1.6;resize:vertical;outline:none}
textarea#pasteBox:focus{border-color:rgba(201,168,76,.4)}
textarea#pasteBox::placeholder{color:var(--muted)}

.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn-primary{background:var(--gold);color:var(--black);font-size:13px;font-weight:600;padding:12px 22px;border-radius:8px;letter-spacing:.04em;border:none;cursor:pointer;font-family:'Outfit',sans-serif;transition:background .2s}
.btn-primary:hover{background:var(--gold-light)}
.btn-ghost{background:transparent;border:1px solid var(--mid);color:var(--muted);font-size:13px;padding:12px 22px;border-radius:8px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s}
.btn-ghost:hover{border-color:rgba(201,168,76,.4);color:var(--white)}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.field input,.field select,.field textarea{background:var(--black);border:1px solid var(--mid);border-radius:8px;padding:11px 12px;color:var(--white);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(201,168,76,.4)}
.field textarea{min-height:80px;resize:vertical}
.field-required label::after{content:' *';color:var(--gold)}

#reviewPanel{display:none}
#successPanel{display:none;text-align:center;padding:40px 24px}
.success-icon{font-size:48px;margin-bottom:12px}
.success-code{font-family:monospace;color:var(--gold);font-size:16px;letter-spacing:.04em;margin:8px 0 20px}

@media(max-width:640px){
  .field-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="logo-header">
  <a href="bookers-details.html">
    <div>
      <div class="logo-text">MA<span>XX</span> EVENTS</div>
      <div class="logo-sub">Manual Entry</div>
    </div>
  </a>
</div>

<section class="page-header">
  <div class="page-eyebrow">Import Quote</div>
  <h1 class="page-title">PASTE <span>&amp; SAVE</span></h1>
  <p class="page-sub">Paste the full WhatsApp quote message from the booking form — every field and all services are parsed and saved automatically.</p>
</section>

<div class="wrap">

  <div class="panel" id="pasteStep">
    <div class="panel-title">📋 Paste WhatsApp Quote Message</div>
    <textarea id="pasteBox" placeholder="Paste the complete MAXX Events quote message here (the formatted message with Quote Code, Client Details, Services, Food Count, etc.)"></textarea>
    <div class="btn-row">
      <button class="btn-primary" id="saveBtn" onclick="handlePasteAndSave()">✨ Paste &amp; Save</button>
    </div>
    <div id="parseError" style="display:none;margin-top:14px;padding:12px 14px;background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.3);border-radius:8px;font-size:13px;color:#ff8080"></div>
  </div>

  <div class="panel" id="successPanel">
    <div class="success-icon">✅</div>
    <div class="panel-title" style="justify-content:center">Saved</div>
    <div class="success-code" id="successCode"></div>
    <div id="successSummary" style="text-align:left;font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:20px"></div>
    <div class="btn-row" style="justify-content:center">
      <a href="bookers-details.html" class="btn-primary" style="text-decoration:none">View Bookers Details →</a>
      <button class="btn-ghost" onclick="resetForm()">➕ Add Another</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin/config.js"></script>
<script src="js/maxx-leads.js"></script>
<script>
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbxRPtvhaNhVA3w24b3lu2cf4dVxij_GxPCByX737xrulo1xyec2x9ntyRiZjSLMHcy4/exec";

function generateCode() {
  const n = new Date();
  const yy = String(n.getFullYear()).slice(2);
  const mm = String(n.getMonth() + 1).padStart(2, "0");
  const dd = String(n.getDate()).padStart(2, "0");
  const rand = String(Math.floor(Math.random() * 900) + 100);
  return `MX${yy}${mm}${dd}-${rand}`;
}

function cleanValue(val) {
  return val.replace(/^\*+|\*+$/g, "").trim();
}

// Same structure as booking_form localStorage: { "💐 Garland & Floral": ["item1", ...] }
function parseServicesBlock(text) {
  const services = {};
  let servicesCount = 0;

  const headerMatch = text.match(/SELECTED SERVICES\*?\s*\((\d+)\s*items?\)/i);
  if (headerMatch) servicesCount = parseInt(headerMatch[1], 10);

  const startIdx = text.search(/SELECTED SERVICES/i);
  if (startIdx === -1) return { services, servicesCount };

  const endIdx = text.search(/FOOD COUNT/i);
  const block = endIdx > startIdx ? text.slice(startIdx, endIdx) : text.slice(startIdx);
  let currentCat = null;

  for (const line of block.split(/\r?\n/)) {
    const trimmed = line.trim();
    if (!trimmed || /SELECTED SERVICES/i.test(trimmed) || /^[┄━─]+/.test(trimmed)) continue;

    const serviceMatch = trimmed.match(/^➤\s*(.+)$/);
    if (serviceMatch) {
      if (currentCat) {
        if (!services[currentCat]) services[currentCat] = [];
        services[currentCat].push(serviceMatch[1].trim());
      }
      continue;
    }

    if (!trimmed.startsWith("➤") && /[\u{1F300}-\u{1FAFF}]/u.test(trimmed)) {
      currentCat = trimmed;
    }
  }

  const actualCount = Object.values(services).flat().length;
  if (actualCount > 0) servicesCount = actualCount;

  return { services, servicesCount };
}

// Parses the exact WhatsApp quote format from the booking form
function parseLabeledLines(text) {
  const result = {};

  for (const line of text.split(/\r?\n/)) {
    const cleaned = line.replace(/^[^\w*]+/, "").replace(/\*+/g, "");
    const idx = cleaned.indexOf(":");
    if (idx === -1) continue;

    const label = cleaned.slice(0, idx).toLowerCase().trim();
    const value = cleanValue(cleaned.slice(idx + 1));
    if (!label || !value) continue;

    if (label.includes("quote code")) result.quoteCode = value;
    else if (label.includes("whatsapp") || label.includes("phone") || label.includes("mobile")) {
      const digits = value.replace(/\D/g, "").slice(-10);
      if (digits.length === 10) result.phone = digits;
    }
    else if (label.includes("bride") || label.includes("groom") || (label.includes("person") && !label.includes("name"))) result.personName = value;
    else if (label.includes("venue type")) result.venueType = value;
    else if (label.includes("venue name")) result.venueNote = value;
    else if (label.includes("event type")) result.eventType = value;
    else if (label.includes("event date")) result.date = normalizeDate_(value);
    else if (label.includes("location")) result.location = value;
    else if (label.includes("budget")) result.budget = value;
    else if (label.includes("non-veg") || label.includes("non veg")) result.nonVegCount = /not specified/i.test(value) ? "" : value;
    else if (label === "veg" || (label.includes("veg") && !label.includes("non"))) result.vegCount = /not specified/i.test(value) ? "" : value;
    else if (label === "name") result.name = value;
  }

  return result;
}

function normalizeDate_(value) {
  // Already ISO (yyyy-mm-dd) — what <input type=date> expects
  let m = value.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;

  // dd/mm/yyyy or dd-mm-yyyy
  m = value.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if (m) {
    let y = m[3];
    if (y.length === 2) y = "20" + y;
    return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  }

  // "26 March 2027" or "March 26, 2027"
  const months = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
  const monthRe = "jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?";
  m = value.match(new RegExp(`\\b(\\d{1,2})\\s+(${monthRe})\\s*,?\\s*(\\d{4})\\b`, "i"));
  if (m) return `${m[3]}-${String(months[m[2].slice(0,3).toLowerCase()]).padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m = value.match(new RegExp(`\\b(${monthRe})\\s+(\\d{1,2}),?\\s*(\\d{4})\\b`, "i"));
  if (m) return `${m[3]}-${String(months[m[1].slice(0,3).toLowerCase()]).padStart(2,"0")}-${m[2].padStart(2,"0")}`;

  return "";
}

// ── FALLBACK KEYWORD PARSE ──
// Used to fill in anything the label-line parser above didn't find, for
// raw unstructured customer messages that don't use "Label : Value" lines.
function parseKeywords_(text) {
  const result = {};

  let m = text.match(/(?:\+?91[\s\-]?)?([6-9]\d{9})\b/);
  if (m) result.phone = m[1];

  m = text.match(/name\s*[:\-]\s*([^\n,]+)/i);
  if (m) result.name = m[1].trim();

  if (!result.name) {
    m = text.match(/^\s*([A-Za-z][A-Za-z\s.]{1,30}?)\s*[,\-\n]/);
    if (m && !/name/i.test(m[1])) result.name = m[1].trim();
  }

  m = text.match(/\b(?:at|in)\s+([A-Z][a-zA-Z]+(?:\s[A-Z][a-zA-Z]+)?)/);
  if (m) result.location = m[1].trim();

  m = text.match(/₹\s?[\d,]+(?:\s*[-–]\s*₹?\s?[\d,]+)?/);
  if (m) result.budget = m[0].trim();

  const date = normalizeDate_(text);
  if (date) result.date = date;

  const eventKeywords = [
    { re: /wedding|marriage|reception/i, label: "💍 Wedding / Reception" },
    { re: /engagement|ring ceremony/i, label: "💑 Engagement" },
    { re: /haldi|mehndi|mehendi/i, label: "🌿 Haldi & Mehndi" },
    { re: /birthday/i, label: "🎂 Birthday" },
    { re: /puberty|manjal/i, label: "🌸 Puberty Ceremony" },
  ];
  for (const k of eventKeywords) { if (k.re.test(text)) { result.eventType = k.label; break; } }

  const venueKeywords = [
    { re: /mandapam/i, label: "🛕 Kalyana Mandapam" },
    { re: /marriage hall|\bhall\b/i, label: "🏛️ Marriage Hall" },
    { re: /hotel|banquet/i, label: "🏨 Hotel / Banquet" },
    { re: /outdoor|garden|open ground/i, label: "🌳 Outdoor / Open Space" },
  ];
  for (const k of venueKeywords) { if (k.re.test(text)) { result.venueType = k.label; break; } }

  let nonVegSpan = null;
  m = text.match(/non[\s\-]?veg\D{0,20}(\d[\d,\-–\s]*\d|\d+)/i);
  if (m) { result.nonVegCount = m[1].trim(); nonVegSpan = m.index; }

  const vegText = nonVegSpan !== null ? text.slice(0, nonVegSpan) + text.slice(nonVegSpan + m[0].length) : text;
  m = vegText.match(/\bveg\D{0,20}(\d[\d,\-–\s]*\d|\d+)/i);
  if (m) result.vegCount = m[1].trim();

  return result;
}

function parseEnquiryText(text) {
  const fallback = parseKeywords_(text);
  const labeled = parseLabeledLines(text);
  const { services, servicesCount } = parseServicesBlock(text);
  const result = { ...fallback, ...labeled, services, servicesCount };
  result.notes = "";
  result.status = "New";
  result.source = "manual";
  if (!result.quoteCode) result.quoteCode = generateCode();
  return result;
}

function showError(msg) {
  const el = document.getElementById("parseError");
  el.textContent = msg;
  el.style.display = "block";
}

function hideError() {
  document.getElementById("parseError").style.display = "none";
}

function buildSuccessSummary(data) {
  const lines = [
    `<strong style="color:var(--white)">${escapeHtml(data.name)}</strong>`,
    data.phone ? `📱 ${escapeHtml(data.phone)}` : "",
    data.eventType ? `${escapeHtml(data.eventType)}` : "",
    data.date ? `📅 ${escapeHtml(data.date)}` : "",
    data.location ? `📍 ${escapeHtml(data.location)}` : "",
    data.budget ? `💰 ${escapeHtml(data.budget)}` : "",
    data.servicesCount ? `✅ ${data.servicesCount} services parsed` : "",
  ].filter(Boolean);
  return lines.join("<br>");
}

function escapeHtml(str) {
  if (!str) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function saveBooker(data) {
  const bookerData = {
    quoteCode: data.quoteCode,
    name: data.name,
    phone: data.phone,
    personName: data.personName || "",
    eventType: data.eventType || "",
    date: data.date || "",
    location: data.location || "",
    venueType: data.venueType || "",
    venueNote: data.venueNote || "",
    budget: data.budget || "",
    services: data.services || {},
    servicesCount: data.servicesCount || 0,
    nonVegCount: data.nonVegCount || "",
    vegCount: data.vegCount || "",
    notes: data.notes || "",
    status: data.status || "New",
    source: data.source || "manual",
    submittedAt: new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }),
  };

  // Save to Supabase DB (primary)
  if (window.MaxxLeads && window.MaxxLeads.createPublicLead) {
    try {
      await window.MaxxLeads.createPublicLead(bookerData);
    } catch (e) {
      console.error("Failed to save lead to Supabase:", e);
    }
  }

  // localStorage fallback
  try {
    const existing = JSON.parse(localStorage.getItem("maxx_bookers") || "[]");
    const dupIdx = existing.findIndex(b => b.quoteCode === bookerData.quoteCode);
    if (dupIdx !== -1) existing[dupIdx] = bookerData;
    else existing.push(bookerData);
    localStorage.setItem("maxx_bookers", JSON.stringify(existing));
  } catch (e) {
    console.error("Failed to cache booker locally:", e);
  }

  // Sheets fallback
  if (SHEETS_URL) {
    try {
      await fetch(SHEETS_URL, {
        method: "POST",
        body: JSON.stringify({
          quoteCode: bookerData.quoteCode,
          name: bookerData.name,
          phone: bookerData.phone,
          personName: bookerData.personName,
          eventType: bookerData.eventType,
          date: bookerData.date,
          location: bookerData.location,
          venueType: bookerData.venueType,
          venueName: bookerData.venueNote,
          budget: bookerData.budget,
          servicesCount: bookerData.servicesCount,
          nonVegCount: bookerData.nonVegCount,
          vegCount: bookerData.vegCount,
          notes: bookerData.notes,
          status: bookerData.status,
          source: bookerData.source,
          services: bookerData.services,
        }),
      });
    } catch (e) {
      console.error("Failed to save booker to sheet:", e);
    }
  }

  return bookerData;
}

async function handlePasteAndSave() {
  hideError();
  const text = document.getElementById("pasteBox").value.trim();
  if (!text) {
    showError("Paste the WhatsApp quote message first.");
    return;
  }

  const data = parseEnquiryText(text);
  if (!data.name || !data.phone) {
    showError("Could not find Name and WhatsApp number in the message. Check the paste is the full quote format.");
    return;
  }

  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  btn.textContent = "Saving…";

  try {
    await saveBooker(data);
    document.getElementById("pasteStep").style.display = "none";
    document.getElementById("successCode").textContent = data.quoteCode;
    document.getElementById("successSummary").innerHTML = buildSuccessSummary(data);
    document.getElementById("successPanel").style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "✨ Paste & Save";
  }
}

function resetForm() {
  document.getElementById("pasteBox").value = "";
  hideError();
  document.getElementById("pasteStep").style.display = "block";
  document.getElementById("successPanel").style.display = "none";
}
</script>
</body>
</html>
