<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — MAXX Events & Planners</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin/css/admin-nav.css">
<link rel="stylesheet" href="admin/css/admin-ui.css">
<style>
.toolbar { display: grid; gap: 12px; margin-bottom: 16px; }
.toolbar-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { position: relative; flex: 1 1 260px; min-width: 220px; }
.search .input { padding-left: 38px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.seg { display: inline-flex; background: var(--charcoal); border: 1px solid var(--mid); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
.seg button { background: transparent; border: 0; color: var(--dim); font-size: 12px; padding: 7px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
.seg button:hover { color: var(--white); }
.seg button.on { background: rgba(201, 168, 76, .16); color: var(--gold); font-weight: 600; }
.count-line { color: var(--dim); font-size: 12px; margin: 0 0 12px; }
.tools { position: relative; }
.tools summary { list-style: none; }
.tools summary::-webkit-details-marker { display: none; }
.tools-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; background: var(--charcoal); border: 1px solid var(--mid); border-radius: 10px; padding: 6px; min-width: 260px; box-shadow: 0 14px 40px rgba(0, 0, 0, .55); }
.tools-menu button { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: var(--white); padding: 10px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.tools-menu button:hover { background: rgba(201, 168, 76, .1); }
.tools-menu small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }

.year { margin-bottom: 14px; border: 1px solid var(--mid); border-radius: var(--radius); background: rgba(26, 26, 26, .55); overflow: hidden; }
.year > .grp-head { background: var(--charcoal); }
.grp-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: transparent; border: 0; color: var(--white); cursor: pointer; text-align: left; }
.grp-head:hover { background: rgba(201, 168, 76, .05); }
.chev { width: 18px; height: 18px; color: var(--gold); transition: transform .2s var(--ease); flex: none; }
.open > .grp-head .chev { transform: rotate(90deg); }
.grp-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: .05em; line-height: 1; }
.month .grp-title { font-size: 20px; color: var(--gold-light); }
.grp-meta { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.tag { font-size: 11px; color: var(--dim); border: 1px solid var(--mid); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.tag.gold { color: var(--gold); border-color: rgba(201, 168, 76, .35); }
.tag.purple { color: #c18ad8; border-color: rgba(155, 89, 182, .4); }
.grp-body { display: none; }
.open > .grp-body { display: block; }
.month { border-top: 1px solid var(--mid); }
.month > .grp-body { padding: 0 8px 10px; }

.lt { width: 100%; border-collapse: collapse; font-size: 13px; }
.lt th { text-align: left; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--mid); white-space: nowrap; }
.lt td { padding: 11px 10px; border-bottom: 1px solid rgba(42, 42, 42, .6); vertical-align: middle; }
.lt tr:last-child td { border-bottom: 0; }
.lt tbody tr:hover td { background: rgba(201, 168, 76, .045); }
.cell-name { font-weight: 600; }
.cell-sub { color: var(--dim); font-size: 12px; }
.link-cell { background: none; border: 0; padding: 0; color: var(--gold); font-family: ui-monospace, monospace; font-size: 12px; cursor: pointer; letter-spacing: .03em; }
.link-cell:hover { text-decoration: underline; }
.phone { color: var(--white); text-decoration: none; white-space: nowrap; }
.phone:hover { color: var(--green); }
.row-actions { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: nowrap; }
.warn-dot { display: inline-block; width: 7px; height: 7px; background: var(--red); border-radius: 50%; margin-right: 6px; vertical-align: middle; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: rgba(201, 168, 76, .08); border: 1px solid rgba(201, 168, 76, .18); color: var(--gold); font-size: 11px; padding: 3px 10px; border-radius: 999px; }
.svc { background: var(--black); border: 1px solid var(--mid); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.svc b { color: var(--gold); font-size: 12px; display: block; margin-bottom: 4px; }
.svc ul { margin: 0; padding-left: 16px; color: var(--dim); font-size: 12px; }
.wa-box { background: rgba(37, 211, 102, .05); border: 1px solid rgba(37, 211, 102, .22); border-radius: var(--radius); padding: 14px; }
.wa-box .textarea { min-height: 170px; font-size: 13px; }
.wa-hint { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
.row-gap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

@media (max-width: 960px) {
  .lt thead { display: none; }
  .lt, .lt tbody, .lt tr, .lt td { display: block; }
  .lt tr { border: 1px solid var(--mid); border-radius: 12px; margin: 8px 4px; padding: 10px 12px; background: var(--charcoal); }
  .lt td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 5px 0; border: 0; text-align: right; }
  .lt td::before { content: attr(data-label); color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; text-align: left; flex: none; }
  .lt td.td-actions { justify-content: stretch; }
  .lt td.td-actions::before { display: none; }
  .lt td.td-actions .row-actions { width: 100%; }
  .lt td.td-actions .btn-ui { flex: 1; }
  .grp-meta .tag:not(.gold) { display: none; }
}
</style>
</head>
<body>

<header class="admin-header">
  <a class="admin-brand" href="admin/index.html">MA<span>XX</span> ADMIN</a>
  <div class="admin-nav" id="topNav">
    <a class="admin-link" href="admin/index.html" data-module="dashboard">Dashboard</a>
    <a class="admin-link" href="admin/events.html" data-module="events">Events</a>
    <a class="admin-link" href="admin/operations.html" data-module="operations">Operations</a>
    <a class="admin-link" href="admin/event-assign.html" data-module="event_assign">Assign Users</a>
    <a class="admin-link" href="admin/event-feed.html" data-module="event_feed">Event Feed</a>
    <a class="admin-link" href="bookers-details.html" data-module="leads">Leads</a>
    <a class="admin-link" href="admin/users.html" data-module="users">Users</a>
    <a class="admin-link" href="manual-entry.html" data-module="manual_entry">Manual Entry</a>
    <a class="admin-link" href="booking_form/index.html" data-module="booking_form">Booking Form</a>
    <button id="logoutBtn" class="admin-btn" type="button">Sign Out</button>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <div class="eyebrow">Lead Management</div>
      <h1 class="title">LEADS <span>&amp; BOOKINGS</span></h1>
      <p class="sub" id="authBanner">Checking login…</p>
    </div>
    <div class="actions">
      <a href="manual-entry.html" class="btn-ui">＋ Manual entry</a>
      <button class="btn-ui" id="refreshBtn" type="button">↻ Refresh</button>
      <button class="btn-ui" id="exportBtn" type="button">⬇ Export CSV</button>
      <details class="tools" id="toolsMenu">
        <summary class="btn-ui">⋯ More</summary>
        <div class="tools-menu">
          <button type="button" data-tool="sheet">Import from Google Sheet<small>One-time. Needs the ADMIN_TOKEN from the Apps Script.</small></button>
          <button type="button" data-tool="browser">Import leads saved in this browser<small>Old leads kept by the previous version of this page.</small></button>
        </div>
      </details>
    </div>
  </div>

  <div id="errorBox" class="banner banner-error" role="alert" style="display:none"></div>

  <section class="stats" id="stats" aria-label="Lead summary"></section>

  <section class="toolbar" aria-label="Filters">
    <div class="toolbar-row">
      <div class="search">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
        <label class="sr-only" for="q">Search leads</label>
        <input class="input" id="q" type="search" placeholder="Search name, phone, reference, city, event…" autocomplete="off">
      </div>
      <div class="seg" id="basisSeg" role="group" aria-label="Group by">
        <button type="button" data-basis="event" class="on">By event date</button>
        <button type="button" data-basis="received">By received date</button>
      </div>
      <label class="sr-only" for="yearSel">Year</label>
      <select class="select select-sm" id="yearSel" style="width:auto"></select>
      <label class="sr-only" for="monthSel">Month</label>
      <select class="select select-sm" id="monthSel" style="width:auto"></select>
      <button class="btn-ui btn-sm" id="orderBtn" type="button" title="Toggle order"></button>
    </div>
    <div class="toolbar-row">
      <div class="seg" id="statusSeg" role="group" aria-label="Status"></div>
      <button class="btn-ui btn-sm" id="expandBtn" type="button">Expand all</button>
      <button class="btn-ui btn-sm" id="collapseBtn" type="button">Collapse all</button>
    </div>
  </section>

  <p class="count-line" id="countLine"></p>
  <div id="list" aria-live="polite"></div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Lead details">
  <div class="drawer-head">
    <div>
      <div class="drawer-title" id="dTitle"></div>
      <div class="drawer-code" id="dCode"></div>
    </div>
    <button class="btn-ui btn-icon" id="dClose" type="button" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin/config.js"></script>
<script src="admin/js/auth.js"></script>
<script src="js/maxx-leads.js"></script>
<script>
(function () {
  'use strict';

  var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxRPtvhaNhVA3w24b3lu2cf4dVxij_GxPCByX737xrulo1xyec2x9ntyRiZjSLMHcy4/exec';
  var STATUSES = ['New', 'Contacted', 'Quoted', 'Confirmed', 'Cancelled'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var L = window.MaxxLeads;

  var leads = [];
  var me = null;
  var channel = null;
  var drawerId = null;
  var drawerActivity = [];
  var userToggled = {};
  var filters = { q: '', status: 'all', basis: 'event', year: 'all', month: 'all', order: 'desc' };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pillClass(s) { return 'pill pill-' + String(s || 'new').toLowerCase(); }

  /* ---------- dates (all in India time) ---------- */
  var ISTFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' });
  function istDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return isNaN(d.getTime()) ? '' : ISTFmt.format(d); // YYYY-MM-DD
  }
  function todayIst() { return ISTFmt.format(new Date()); }
  function fmtDay(ymd) {
    if (!ymd) return '—';
    var p = String(ymd).slice(0, 10).split('-');
    if (p.length !== 3) return ymd;
    return parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1].slice(0, 3) + ' ' + p[0];
  }
  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function leadDay(l) { return filters.basis === 'event' ? (l.date ? String(l.date).slice(0, 10) : '') : istDate(l.submittedAt); }

  /* ---------- toasts / errors ---------- */
  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(function () { el.remove(); }, kind === 'err' ? 6000 : 3200);
  }
  function showError(msg) {
    var box = $('errorBox');
    box.style.display = msg ? 'block' : 'none';
    box.textContent = msg || '';
  }

  /* ---------- filtering + grouping ---------- */
  function matches(l) {
    if (filters.status !== 'all' && l.status !== filters.status) return false;
    var q = filters.q.trim().toLowerCase();
    if (q) {
      var hay = [l.name, l.personName, l.phone, l.phoneE164, l.quoteCode, l.location, l.eventType, l.venueNote, l.budget].join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    var day = leadDay(l);
    if (filters.year !== 'all') {
      if (!day || day.slice(0, 4) !== String(filters.year)) return false;
      if (filters.month !== 'all' && parseInt(day.slice(5, 7), 10) - 1 !== Number(filters.month)) return false;
    }
    return true;
  }

  function groupLeads(list) {
    var years = {};
    list.forEach(function (l) {
      var day = leadDay(l);
      var y = day ? day.slice(0, 4) : 'nodate';
      var m = day ? parseInt(day.slice(5, 7), 10) - 1 : 0;
      years[y] = years[y] || { year: y, months: {}, total: 0 };
      years[y].months[m] = years[y].months[m] || { month: m, leads: [] };
      years[y].months[m].leads.push(l);
      years[y].total++;
    });
    var dir = filters.order === 'desc' ? -1 : 1;
    var out = Object.keys(years).filter(function (k) { return k !== 'nodate'; }).sort(function (a, b) { return (a - b) * dir; }).map(function (k) { return years[k]; });
    if (years.nodate) out.push(years.nodate);
    out.forEach(function (y) {
      y.monthList = Object.keys(y.months).map(Number).sort(function (a, b) { return (a - b) * dir; }).map(function (m) {
        var g = y.months[m];
        // inside a month: event basis = soonest first; received basis = newest first
        g.leads.sort(function (a, b) {
          if (filters.basis === 'event') return (leadDay(a) || '').localeCompare(leadDay(b) || '');
          return String(b.submittedAt).localeCompare(String(a.submittedAt));
        });
        return g;
      });
    });
    return out;
  }

  function isOpen(key, defaultOpen) { return key in userToggled ? userToggled[key] : defaultOpen; }

  /* ---------- rendering ---------- */
  function renderStats() {
    var total = leads.length;
    var by = {};
    STATUSES.forEach(function (s) { by[s] = 0; });
    leads.forEach(function (l) { by[l.status] = (by[l.status] || 0) + 1; });
    var thisMonth = todayIst().slice(0, 7);
    var monthCount = leads.filter(function (l) { return istDate(l.submittedAt).slice(0, 7) === thisMonth; }).length;
    var rate = total ? Math.round((by.Confirmed / total) * 100) : 0;
    var cards = [
      ['all', total, 'Total leads'],
      ['_month', monthCount, 'Received this month'],
      ['New', by.New, 'New — need reply'],
      ['Quoted', by.Quoted, 'Quoted'],
      ['Confirmed', by.Confirmed, 'Confirmed'],
      ['_rate', rate + '%', 'Confirmed rate']
    ];
    $('stats').innerHTML = cards.map(function (c) {
      var clickable = STATUSES.indexOf(c[0]) !== -1 || c[0] === 'all';
      var active = clickable && filters.status === c[0];
      var tag = clickable ? 'button type="button" data-stat="' + esc(c[0]) + '"' : 'div';
      var close = clickable ? 'button' : 'div';
      return '<' + tag + ' class="stat' + (active ? ' is-active' : '') + '"><div class="stat-num">' + esc(c[1]) + '</div><div class="stat-label">' + esc(c[2]) + '</div></' + close + '>';
    }).join('');
  }

  function renderStatusSeg() {
    var items = ['all'].concat(STATUSES);
    $('statusSeg').innerHTML = items.map(function (s) {
      var n = s === 'all' ? leads.length : leads.filter(function (l) { return l.status === s; }).length;
      return '<button type="button" data-status="' + s + '" class="' + (filters.status === s ? 'on' : '') + '">' + (s === 'all' ? 'All' : s) + ' <span style="opacity:.6">' + n + '</span></button>';
    }).join('');
  }

  function renderYearMonthSelectors() {
    var years = {};
    leads.forEach(function (l) { var d = leadDay(l); if (d) years[d.slice(0, 4)] = true; });
    var ys = Object.keys(years).sort().reverse();
    if (filters.year !== 'all' && !years[filters.year]) { filters.year = 'all'; filters.month = 'all'; }
    $('yearSel').innerHTML = '<option value="all">All years</option>' + ys.map(function (y) {
      return '<option value="' + y + '"' + (String(filters.year) === y ? ' selected' : '') + '>' + y + '</option>';
    }).join('');
    var ms = '<option value="all">All months</option>' + MONTHS.map(function (m, i) {
      return '<option value="' + i + '"' + (String(filters.month) === String(i) ? ' selected' : '') + '>' + m + '</option>';
    }).join('');
    $('monthSel').innerHTML = ms;
    $('monthSel').disabled = filters.year === 'all';
    $('orderBtn').textContent = filters.order === 'desc' ? '↓ Newest first' : '↑ Oldest first';
  }

  function leadRow(l) {
    var tel = l.phoneE164 ? 'tel:+' + l.phoneE164 : 'tel:' + esc(l.phone);
    var needsReply = l.status === 'New';
    var badPhone = !l.phoneE164;
    return '<tr data-id="' + esc(l.id) + '">' +
      '<td data-label="Ref"><button class="link-cell" type="button" data-action="open">' + esc(l.quoteCode) + '</button></td>' +
      '<td data-label="Customer"><div class="cell-name">' + (needsReply ? '<span class="warn-dot" title="Not contacted yet"></span>' : '') + esc(l.name) + '</div>' +
        (l.personName ? '<div class="cell-sub">' + esc(l.personName) + '</div>' : '') + '</td>' +
      '<td data-label="Phone"><a class="phone" href="' + tel + '">' + esc(L.formatPhone(l.phone)) + '</a>' + (badPhone ? '<div class="cell-sub" style="color:var(--red)">Invalid number</div>' : '') + '</td>' +
      '<td data-label="Event">' + esc(l.eventType || '—') + '</td>' +
      '<td data-label="Event date">' + esc(fmtDay(l.date)) + '</td>' +
      '<td data-label="Location">' + esc(l.location || '—') + '</td>' +
      '<td data-label="Budget">' + esc(l.budget || '—') + '</td>' +
      '<td data-label="Status"><select class="select select-sm" data-action="status" aria-label="Status for ' + esc(l.name) + '" style="width:auto">' +
        STATUSES.map(function (s) { return '<option' + (s === l.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></td>' +
      '<td class="td-actions" data-label=""><div class="row-actions">' +
        '<button class="btn-ui btn-wa btn-sm" type="button" data-action="wa"' + (badPhone ? ' disabled' : '') + '>WhatsApp</button>' +
        '<button class="btn-ui btn-sm" type="button" data-action="open">View</button></div></td>' +
      '</tr>';
  }

  function render() {
    renderStats();
    renderStatusSeg();
    renderYearMonthSelectors();

    var shown = leads.filter(matches);
    $('countLine').textContent = leads.length ? 'Showing ' + shown.length + ' of ' + leads.length + ' leads — grouped by ' + (filters.basis === 'event' ? 'event date' : 'received date') : '';

    if (!leads.length) {
      $('list').innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">NO LEADS YET</div><p class="empty-desc">When someone submits the booking form, their request appears here. You can also add one by hand.</p><a class="btn-ui btn-solid" href="manual-entry.html">Add a lead</a></div>';
      return;
    }
    if (!shown.length) {
      $('list').innerHTML = '<div class="empty"><div class="empty-icon">🔎</div><div class="empty-title">NOTHING MATCHES</div><p class="empty-desc">Try clearing the search, status or date filters.</p><button class="btn-ui" type="button" data-action="reset">Clear filters</button></div>';
      return;
    }

    var curYear = todayIst().slice(0, 4);
    // While searching / filtering by status, open every group so results are never hidden.
    var autoOpen = filters.q.trim() !== '' || filters.status !== 'all';
    var groups = groupLeads(shown);
    $('list').innerHTML = groups.map(function (y) {
      var yKey = 'y-' + y.year;
      var yOpen = isOpen(yKey, autoOpen || y.year === 'nodate' || y.year >= curYear || groups.length === 1 || filters.year !== 'all');
      var yConfirmed = 0;
      y.monthList.forEach(function (m) { m.leads.forEach(function (l) { if (l.status === 'Confirmed') yConfirmed++; }); });
      var months = y.monthList.map(function (m) {
        var mKey = 'm-' + y.year + '-' + m.month;
        var mOpen = isOpen(mKey, autoOpen || y.year === 'nodate' || y.year >= curYear || filters.year !== 'all');
        var mNew = m.leads.filter(function (l) { return l.status === 'New'; }).length;
        var mConf = m.leads.filter(function (l) { return l.status === 'Confirmed'; }).length;
        var label = y.year === 'nodate' ? 'No event date' : MONTHS[m.month] + ' ' + y.year;
        return '<div class="month' + (mOpen ? ' open' : '') + '">' +
          '<button class="grp-head" type="button" data-toggle="' + mKey + '" aria-expanded="' + mOpen + '">' +
          '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 4 6 6-6 6"/></svg>' +
          '<span class="grp-title">' + esc(label) + '</span>' +
          '<span class="grp-meta"><span class="tag gold">' + m.leads.length + ' lead' + (m.leads.length === 1 ? '' : 's') + '</span>' +
          (mNew ? '<span class="tag">' + mNew + ' new</span>' : '') + (mConf ? '<span class="tag purple">' + mConf + ' confirmed</span>' : '') + '</span></button>' +
          '<div class="grp-body"><table class="lt"><thead><tr><th>Ref</th><th>Customer</th><th>Phone</th><th>Event</th><th>Event date</th><th>Location</th><th>Budget</th><th>Status</th><th></th></tr></thead><tbody>' +
          (mOpen ? m.leads.map(leadRow).join('') : '') + '</tbody></table></div></div>';
      }).join('');
      return '<section class="year' + (yOpen ? ' open' : '') + '">' +
        '<button class="grp-head" type="button" data-toggle="' + yKey + '" aria-expanded="' + yOpen + '">' +
        '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 4 6 6-6 6"/></svg>' +
        '<span class="grp-title">' + (y.year === 'nodate' ? 'NO DATE' : esc(y.year)) + '</span>' +
        '<span class="grp-meta"><span class="tag gold">' + y.total + ' lead' + (y.total === 1 ? '' : 's') + '</span>' +
        (yConfirmed ? '<span class="tag purple">' + yConfirmed + ' confirmed</span>' : '') + '</span></button>' +
        '<div class="grp-body">' + months + '</div></section>';
    }).join('');
  }

  /* ---------- data ---------- */
  async function load(silent) {
    try {
      showError('');
      if (!silent) {
        $('list').innerHTML = '<div class="skeleton" style="height:64px;margin-bottom:10px"></div><div class="skeleton" style="height:64px;margin-bottom:10px"></div><div class="skeleton" style="height:64px"></div>';
      }
      leads = await L.listLeads();
      render();
      if (drawerId) {
        var cur = findLead(drawerId);
        if (cur) { await refreshActivity(); renderDrawer(); }
      }
    } catch (e) {
      console.error('Failed to load leads:', e);
      showError('Could not load leads from the database: ' + (e.message || e) + '. Check your internet / that the Supabase project is running, then press Refresh.');
      if (!silent) $('list').innerHTML = '';
    }
  }

  function findLead(id) { for (var i = 0; i < leads.length; i++) if (leads[i].id === id) return leads[i]; return null; }

  async function changeStatus(id, status, selectEl) {
    var lead = findLead(id);
    if (!lead || lead.status === status) return;
    var prev = lead.status;
    lead.status = status;
    try {
      var saved = await L.updateLeadStatus(id, status);
      if (!saved) throw new Error('Not saved — you may not have permission.');
      toast(lead.name + ' → ' + status, 'ok');
    } catch (e) {
      lead.status = prev;
      if (selectEl) selectEl.value = prev;
      toast('Could not change status: ' + (e.message || e), 'err');
    }
    render();
    if (drawerId === id) { await refreshActivity(); renderDrawer(); }
  }

  async function refreshActivity() {
    try { drawerActivity = await L.listActivity(drawerId); } catch (e) { drawerActivity = []; console.error(e); }
  }

  /* ---------- drawer ---------- */
  function activityHtml(a) {
    var who = a.created_by_email ? ' · ' + esc(a.created_by_email) : '';
    var title;
    if (a.kind === 'status_change') title = 'Status: <b>' + esc(a.from_status || '—') + '</b> → <b>' + esc(a.to_status) + '</b>';
    else if (a.kind === 'whatsapp') title = 'WhatsApp opened' + (a.template ? ' · ' + esc(a.template) : '');
    else if (a.kind === 'note') title = 'Note';
    else if (a.kind === 'call') title = 'Call';
    else title = 'Lead created';
    var body = a.kind === 'whatsapp' && a.message ? '<div class="t-msg">' + esc(a.message) + '</div>' : (a.kind === 'note' ? '<div class="t-msg">' + esc(a.note) + '</div>' : '');
    return '<li class="k-' + esc(a.kind) + '"><div>' + title + '</div><div class="t-meta">' + esc(fmtDateTime(a.created_at)) + who + '</div>' + body + '</li>';
  }

  function renderDrawer() {
    var l = findLead(drawerId);
    if (!l) return;
    $('dTitle').textContent = l.name;
    $('dCode').textContent = l.quoteCode + (l.source && l.source !== 'form' ? ' · ' + l.source : '');
    var tplKey = (l.status === 'Confirmed') ? 'confirmed' : (l.status === 'Quoted' ? 'quote' : (l.status === 'Contacted' ? 'followup' : 'confirmation'));
    var existingTpl = document.getElementById('tplSel');
    if (existingTpl) tplKey = existingTpl.value;
    var msg = L.buildMessage(tplKey, l);
    var existingMsg = document.getElementById('waMsg');
    var keepMsg = existingMsg && existingMsg.dataset.dirty === '1' ? existingMsg.value : msg;

    var svc = Object.keys(l.services || {}).filter(function (k) { return (l.services[k] || []).length; }).map(function (k) {
      return '<div class="svc"><b>' + esc(k) + '</b><ul>' + l.services[k].map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var menus = Object.keys(l.vegMenus || {}).filter(function (k) { return (l.vegMenus[k] || []).length; }).map(function (k) {
      return '<div class="svc"><b>' + esc(k) + '</b><ul>' + l.vegMenus[k].map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
    }).join('');

    $('dBody').innerHTML =
      '<div class="section"><div class="row-gap">' +
        '<span class="' + pillClass(l.status) + '">' + esc(l.status) + '</span>' +
        '<label class="sr-only" for="dStatus">Change status</label>' +
        '<select class="select select-sm" id="dStatus" style="width:auto">' + STATUSES.map(function (s) { return '<option' + (s === l.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
        '<a class="btn-ui btn-sm" href="' + (l.phoneE164 ? 'tel:+' + esc(l.phoneE164) : 'tel:' + esc(l.phone)) + '">📞 Call</a></div></div>' +

      '<div class="section"><h3 class="section-title">Send WhatsApp</h3><div class="wa-box">' +
        (l.phoneE164 ? '' : '<div class="banner banner-error">This phone number looks invalid, so WhatsApp can\'t be opened. Fix the number first.</div>') +
        '<div class="field"><label for="tplSel">Message template</label><select class="select" id="tplSel">' +
          L.TEMPLATES.map(function (t) { return '<option value="' + t.key + '"' + (t.key === tplKey ? ' selected' : '') + '>' + esc(t.label) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field" style="margin-bottom:10px"><label for="waMsg">Message to ' + esc(L.formatPhone(l.phone)) + ' (you can edit)</label><textarea class="textarea" id="waMsg">' + esc(keepMsg) + '</textarea></div>' +
        '<div class="row-gap"><button class="btn-ui btn-wa btn-solid" id="waSend" type="button"' + (l.phoneE164 ? '' : ' disabled') + '>Open in WhatsApp</button>' +
        '<button class="btn-ui btn-sm" id="waCopy" type="button">Copy text</button></div>' +
        '<p class="wa-hint">Opens WhatsApp with this message ready for ' + esc(l.name) + '. Press <b>Send</b> there. This lead is logged as “WhatsApp opened” below, and moves from New to Contacted. (The app cannot see whether you pressed Send.)</p>' +
      '</div></div>' +

      '<div class="section"><h3 class="section-title">Event</h3><dl class="kv">' +
        '<dt>Event</dt><dd>' + esc(l.eventType || '—') + '</dd>' +
        (l.personName ? '<dt>Person</dt><dd>' + esc(l.personName) + '</dd>' : '') +
        '<dt>Date</dt><dd>' + esc(fmtDay(l.date)) + '</dd>' +
        '<dt>Location</dt><dd>' + esc(l.location || '—') + '</dd>' +
        '<dt>Venue</dt><dd>' + esc([l.venueType, l.venueNote].filter(Boolean).join(' — ') || '—') + '</dd>' +
        '<dt>Budget</dt><dd>' + esc(l.budget || '—') + '</dd>' +
        '<dt>Phone</dt><dd>' + esc(L.formatPhone(l.phone)) + '</dd>' +
        '<dt>Received</dt><dd>' + esc(fmtDateTime(l.submittedAt)) + '</dd>' +
        (l.lastContactedAt ? '<dt>Last WhatsApp</dt><dd>' + esc(fmtDateTime(l.lastContactedAt)) + '</dd>' : '') +
        '<dt>Catering</dt><dd>' + esc([l.vegCount ? 'Veg ' + l.vegCount : '', l.nonVegCount ? 'Non-veg ' + l.nonVegCount : ''].filter(Boolean).join(' · ') || '—') + '</dd>' +
      '</dl></div>' +
      (svc ? '<div class="section"><h3 class="section-title">Services (' + (l.servicesCount || 0) + ')</h3>' + svc + '</div>' : '') +
      (menus ? '<div class="section"><h3 class="section-title">Veg menus</h3>' + menus + '</div>' : '') +
      (l.notes ? '<div class="section"><h3 class="section-title">Customer notes</h3><p style="white-space:pre-wrap;font-size:13px;color:var(--dim);margin:0">' + esc(l.notes) + '</p></div>' : '') +

      '<div class="section"><h3 class="section-title">Activity</h3>' +
        '<div class="field"><label class="sr-only" for="noteIn">Add a note</label><textarea class="textarea" id="noteIn" style="min-height:70px" placeholder="Add an internal note (call summary, price discussed…)"></textarea></div>' +
        '<div class="row-gap" style="margin-bottom:16px"><button class="btn-ui btn-sm" id="noteBtn" type="button">Save note</button></div>' +
        (drawerActivity.length ? '<ul class="timeline">' + drawerActivity.map(activityHtml).join('') + '</ul>' : '<p class="cell-sub">No activity yet.</p>') +
      '</div>';

    var ta = $('waMsg');
    if (ta) ta.addEventListener('input', function () { ta.dataset.dirty = '1'; });
  }

  async function openDrawer(id, focusWa) {
    drawerId = id;
    drawerActivity = [];
    var d = $('drawer');
    d.classList.add('open'); d.setAttribute('aria-hidden', 'false');
    $('overlay').classList.add('open');
    renderDrawer();
    await refreshActivity();
    if (drawerId === id) renderDrawer();
    if (focusWa) { var t = $('waMsg'); if (t) t.focus(); }
  }

  function closeDrawer() {
    drawerId = null;
    $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true');
    $('overlay').classList.remove('open');
  }

  function sendWhatsApp() {
    var l = findLead(drawerId);
    if (!l) return;
    var msg = $('waMsg').value.trim();
    var tpl = $('tplSel').value;
    if (!msg) { toast('Message is empty.', 'err'); return; }
    var url = L.whatsappUrl(l.phone, msg);
    if (!url) { toast('Invalid phone number.', 'err'); return; }
    // Open synchronously inside the click so popup blockers allow it.
    var w = window.open(url, '_blank', 'noopener');
    if (!w) { window.location.href = url; }
    L.logWhatsApp(l.id, tpl, msg).then(function () {
      toast('Logged: WhatsApp opened for ' + l.name, 'ok');
      return load(true);
    }).catch(function (e) {
      toast('WhatsApp opened, but logging failed: ' + (e.message || e), 'err');
    });
  }

  /* ---------- CSV export ---------- */
  function csvCell(v) {
    var s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // block spreadsheet formula injection
    return '"' + s.replace(/"/g, '""') + '"';
  }
  function exportCsv() {
    var rows = leads.filter(matches);
    if (!rows.length) { toast('Nothing to export.', 'err'); return; }
    var head = ['Reference', 'Received (IST)', 'Name', 'Phone', 'Person', 'Event', 'Event date', 'Location', 'Venue', 'Budget', 'Services', 'Veg', 'Non-veg', 'Status', 'Source', 'Notes'];
    var lines = [head.map(csvCell).join(',')];
    rows.forEach(function (l) {
      lines.push([l.quoteCode, fmtDateTime(l.submittedAt), l.name, l.phoneE164 ? '+' + l.phoneE164 : l.phone, l.personName, l.eventType, l.date, l.location,
        [l.venueType, l.venueNote].filter(Boolean).join(' - '), l.budget, l.servicesCount, l.vegCount, l.nonVegCount, l.status, l.source, l.notes].map(csvCell).join(','));
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'maxx-leads-' + todayIst() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  /* ---------- one-time legacy import ---------- */
  function parseLegacyDate(s) {
    // en-IN locale strings like "15/11/2026, 4:05:09 pm"
    var m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?/i);
    if (!m) { var d = new Date(s); return isNaN(d.getTime()) ? undefined : d.toISOString(); }
    var h = parseInt(m[4], 10);
    if (m[7]) { var pm = m[7].toLowerCase() === 'pm'; if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
    function p(n) { return String(n).padStart(2, '0'); }
    return m[3] + '-' + p(m[2]) + '-' + p(m[1]) + 'T' + p(h) + ':' + m[5] + ':' + p(m[6] || 0) + '+05:30';
  }
  function normEventDate(s) {
    if (!s) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return String(s);
    return istDate(s);
  }

  async function runImport(rows, label) {
    if (!rows.length) { toast('No leads found to import.', 'err'); return; }
    if (!confirm('Import ' + rows.length + ' lead(s) from ' + label + '?\n\nIf a reference already exists its details are refreshed but its status is kept.')) return;
    var ok = 0, fail = 0, firstErr = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      try {
        await L.createAdminLead({
          quoteCode: r.quoteCode, name: r.name, phone: r.phone, personName: r.personName,
          eventType: r.eventType, date: normEventDate(r.date), location: r.location,
          venueType: r.venueType, venueNote: r.venueNote, budget: r.budget,
          servicesCount: r.servicesCount, nonVegCount: r.nonVegCount, vegCount: r.vegCount,
          notes: r.notes, vegMenus: r.vegMenus, services: r.services,
          status: r.status, source: ['form', 'manual', 'whatsapp'].indexOf(r.source) !== -1 ? r.source : 'import',
          submittedAtIso: parseLegacyDate(r.submittedAt)
        });
        ok++;
      } catch (e) { fail++; if (!firstErr) firstErr = (e.message || String(e)) + ' (' + (r.quoteCode || r.name) + ')'; }
    }
    toast('Import done: ' + ok + ' saved, ' + fail + ' failed' + (firstErr ? ' — first error: ' + firstErr : ''), fail ? 'err' : 'ok');
    await load(true);
  }

  async function importFromSheet() {
    var token = prompt('Paste the ADMIN_TOKEN you saved in the Google Apps Script (Script properties).\nIt is used once and is not stored.');
    if (!token) return;
    try {
      var res = await fetch(SHEETS_URL + '?token=' + encodeURIComponent(token.trim()));
      var data = await res.json();
      if (!data.success) throw new Error(data.error || 'Sheet refused the request');
      await runImport(data.bookers || [], 'the Google Sheet');
    } catch (e) { toast('Sheet import failed: ' + (e.message || e), 'err'); }
  }

  async function importFromBrowser() {
    var rows = [];
    try { rows = JSON.parse(localStorage.getItem('maxx_bookers') || '[]'); } catch (e) { rows = []; }
    await runImport(rows, 'this browser');
  }

  /* ---------- events ---------- */
  function bind() {
    var qTimer;
    $('q').addEventListener('input', function (e) {
      clearTimeout(qTimer);
      qTimer = setTimeout(function () { filters.q = e.target.value; render(); }, 150);
    });
    $('basisSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-basis]'); if (!b) return;
      filters.basis = b.dataset.basis; userToggled = {};
      Array.prototype.forEach.call($('basisSeg').children, function (c) { c.classList.toggle('on', c === b); });
      render();
    });
    $('yearSel').addEventListener('change', function (e) { filters.year = e.target.value; filters.month = 'all'; render(); });
    $('monthSel').addEventListener('change', function (e) { filters.month = e.target.value; render(); });
    $('orderBtn').addEventListener('click', function () { filters.order = filters.order === 'desc' ? 'asc' : 'desc'; render(); });
    $('statusSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-status]'); if (!b) return;
      filters.status = b.dataset.status; render();
    });
    $('stats').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-stat]'); if (!b) return;
      filters.status = filters.status === b.dataset.stat ? 'all' : b.dataset.stat; render();
    });
    $('expandBtn').addEventListener('click', function () {
      document.querySelectorAll('[data-toggle]').forEach(function (el) { userToggled[el.dataset.toggle] = true; });
      render();
    });
    $('collapseBtn').addEventListener('click', function () {
      document.querySelectorAll('[data-toggle]').forEach(function (el) { userToggled[el.dataset.toggle] = false; });
      render();
    });
    $('refreshBtn').addEventListener('click', function () { load(false); });
    $('exportBtn').addEventListener('click', exportCsv);
    $('toolsMenu').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-tool]'); if (!b) return;
      $('toolsMenu').open = false;
      if (b.dataset.tool === 'sheet') importFromSheet(); else importFromBrowser();
    });

    $('list').addEventListener('click', function (e) {
      var t = e.target.closest('[data-toggle]');
      if (t) {
        var key = t.dataset.toggle;
        var wasOpen = t.parentElement.classList.contains('open');
        userToggled[key] = !wasOpen;
        render();
        return;
      }
      if (e.target.closest('[data-action="reset"]')) {
        filters.q = ''; filters.status = 'all'; filters.year = 'all'; filters.month = 'all'; $('q').value = ''; render(); return;
      }
      var tr = e.target.closest('tr[data-id]'); if (!tr) return;
      var act = e.target.closest('[data-action]');
      if (!act) return;
      if (act.dataset.action === 'open') openDrawer(tr.dataset.id, false);
      if (act.dataset.action === 'wa') openDrawer(tr.dataset.id, true);
    });
    $('list').addEventListener('change', function (e) {
      var sel = e.target.closest('select[data-action="status"]'); if (!sel) return;
      var tr = sel.closest('tr[data-id]');
      changeStatus(tr.dataset.id, sel.value, sel);
    });

    $('dClose').addEventListener('click', closeDrawer);
    $('overlay').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawerId) closeDrawer(); });
    $('dBody').addEventListener('change', function (e) {
      if (e.target.id === 'dStatus') changeStatus(drawerId, e.target.value);
      if (e.target.id === 'tplSel') {
        var ta = $('waMsg'); ta.dataset.dirty = '0';
        ta.value = L.buildMessage(e.target.value, findLead(drawerId));
      }
    });
    $('dBody').addEventListener('click', function (e) {
      if (e.target.id === 'waSend') sendWhatsApp();
      if (e.target.id === 'waCopy') {
        var txt = $('waMsg').value;
        (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast('Message copied.', 'ok'); }, function () { $('waMsg').select(); toast('Press Ctrl+C to copy.', ''); });
      }
      if (e.target.id === 'noteBtn') {
        var l = findLead(drawerId); var val = $('noteIn').value;
        if (!val.trim()) { toast('Write a note first.', 'err'); return; }
        L.addNote(l, val).then(function () { toast('Note saved.', 'ok'); return refreshActivity(); }).then(renderDrawer)
          .catch(function (err) { toast('Could not save note: ' + (err.message || err), 'err'); });
      }
    });
  }

  /* ---------- init ---------- */
  (async function init() {
    bind();
    render();
    try {
      if (!window.MaxxAuth) throw new Error(window.MaxxAuthInitError || 'Auth is not available.');
      var session = await MaxxAuth.requireAuth('admin/login.html');
      if (!session) return;
      me = await MaxxAuth.getMe();
      if (!MaxxAuth.canAccessModule(me.role, 'leads')) {
        window.location.href = MaxxAuth.isFullAdmin(me.role) ? 'admin/index.html' : 'admin/event-feed.html';
        return;
      }
      MaxxAuth.applyAdminNav(me.role);
      $('logoutBtn').addEventListener('click', async function () {
        try { await MaxxAuth.signOut(); window.location.href = 'admin/login.html'; }
        catch (err) { toast(err.message || 'Failed to sign out.', 'err'); }
      });
      $('authBanner').innerHTML = 'Signed in as <strong>' + esc(me.email) + '</strong> · ' + esc(me.role) + ' · ' + esc(me.organization_name || 'All organizations');
      await load(false);
      var timer;
      channel = L.subscribeLeads(function () { clearTimeout(timer); timer = setTimeout(function () { load(true); }, 600); });
    } catch (e) {
      console.error(e);
      $('authBanner').textContent = 'Could not start the dashboard.';
      showError((e && e.message) || String(e));
    }
  })();

  window.addEventListener('beforeunload', function () { if (channel) L.unsubscribe(channel); });
})();
</script>
